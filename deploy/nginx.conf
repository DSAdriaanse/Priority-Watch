# /etc/nginx/sites-available/priority-watch  (TLS certs via: certbot --nginx -d priority.apps.swcrs.org)
server {
    listen 80;
    server_name priority.apps.swcrs.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name priority.apps.swcrs.org;

    ssl_certificate     /etc/letsencrypt/live/priority.apps.swcrs.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/priority.apps.swcrs.org/privkey.pem;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # PocketBase admin UI (/_/): uncomment to limit it to your own network.
    # location /_/ { allow 203.0.113.0/24; deny all; proxy_pass http://127.0.0.1:8090; }

    # Realtime (SSE): no buffering, long read timeout, or live updates stall.
    location /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3h;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
